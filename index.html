<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OndaMex – Spanisch für Mexiko</title>
<meta name="description" content="OndaMex – Spanisch-Vokabeln und Floskeln für den Strandurlaub in Mexiko – Lernkarten und Quiz.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌴</text></svg>">
<style>
  :root {
    --bg: #f2f7f6;
    --card: #ffffff;
    --ink: #17323a;
    --muted: #5d7a80;
    --teal: #0f7f8c;
    --teal-dark: #0a5e68;
    --sand: #f7e8c8;
    --danger: #c0392b;
    --ok: #1e8e5a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10222a;
      --card: #1a3038;
      --ink: #e8f1f2;
      --muted: #8fb0b6;
      --teal: #2aa5b3;
      --teal-dark: #1a6f7b;
      --sand: #3a3524;
      --danger: #e07062;
      --ok: #46c08a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.45;
  }
  header {
    background: linear-gradient(135deg, var(--teal-dark), var(--teal));
    color: #fff;
    padding: 24px 16px 18px;
    text-align: center;
  }
  header h1 { font-size: 1.5rem; }
  header p { opacity: .85; font-size: .9rem; margin-top: 4px; }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: 32px;
  }
  .controls { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .segmented {
    display: flex;
    background: var(--card);
    border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
    border-radius: 10px;
    overflow: hidden;
  }
  .segmented button {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 9px 18px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .segmented button.active { background: var(--teal); color: #fff; }
  .toggle {
    margin-left: auto;
    border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
    background: var(--card);
    color: var(--ink);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: .95rem;
    cursor: pointer;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chips button {
    border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
    background: var(--card);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: .85rem;
    cursor: pointer;
  }
  .chips button.active { background: var(--sand); border-color: var(--teal); font-weight: 600; }
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    padding: 24px 20px;
    text-align: center;
  }
  .card .word { font-size: 1.55rem; font-weight: 700; }
  .card .hint { font-size: .8rem; color: var(--muted); margin-top: 6px; }
  .answer {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed color-mix(in srgb, var(--muted) 40%, transparent);
    font-size: 1.25rem;
  }
  .hidden-answer .answer { visibility: hidden; }
  .progress { font-size: .8rem; color: var(--muted); margin-top: 12px; }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .actions button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .actions .secondary {
    background: var(--card);
    color: var(--ink);
    border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
  }
  .actions .primary { background: var(--teal); color: #fff; }
  .quiz-choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .quiz-choices button {
    background: var(--card);
    color: var(--ink);
    border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
    border-radius: 10px;
    padding: 14px 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  .quiz-choices button.correct { background: var(--ok); border-color: var(--ok); color: #fff; }
  .quiz-choices button.wrong { background: var(--danger); border-color: var(--danger); color: #fff; }
  .quiz-choices button:disabled { cursor: default; opacity: .85; }
  .quiz-score { text-align: center; font-size: .85rem; color: var(--muted); margin-top: 12px; }
  .quiz-next { margin-top: 12px; display: none; }
  .quiz-next.visible { display: block; }
  #update-banner {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    background: var(--teal-dark);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    font-size: .9rem;
  }
  #update-banner button {
    border: 1px solid rgba(255,255,255,.5);
    background: transparent;
    color: #fff;
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
    font-size: .85rem;
  }
  #update-banner .ub-yes { background: #fff; color: var(--teal-dark); font-weight: 600; }
  #update-banner[hidden] { display: none; }
  footer {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 24px;
    font-size: .75rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1>🌴 OndaMex</h1>
  <p>Spanisch für den Strandurlaub in Mexiko – die wichtigsten Wörter &amp; Floskeln</p>
</header>
<main>
  <div id="update-banner" hidden>
    <span class="ub-text"></span>
    <button class="ub-later">Später (×)</button>
    <button class="ub-yes">Update laden</button>
  </div>
  <div class="controls">
    <div class="segmented" role="tablist">
      <button id="tab-learn" class="active" role="tab">📖 Lernen</button>
      <button id="tab-quiz" role="tab">🎯 Quiz</button>
    </div>
    <button id="direction" class="toggle">DE → ES</button>
  </div>

  <div class="chips" id="chips"></div>

  <section id="learn-view">
    <div class="card" id="flashcard">
      <div class="word" id="front"></div>
      <div class="hint" id="front-hint"></div>
      <div class="answer">
        <div class="word" id="back"></div>
      </div>
      <div class="progress" id="learn-progress"></div>
    </div>
    <div class="actions">
      <button class="secondary" id="prev">← Zurück</button>
      <button class="primary" id="next">Weiter →</button>
    </div>
  </section>

  <section id="quiz-view" hidden>
    <div class="card">
      <div class="hint">Welches passt zur Frage?</div>
      <div class="word" id="quiz-q" style="margin-top:10px;"></div>
      <div class="quiz-choices" id="quiz-choices"></div>
      <div class="quiz-score" id="quiz-score"></div>
    </div>
    <div class="actions">
      <button class="primary quiz-next" id="quiz-next">Nächste Frage →</button>
    </div>
  </section>
</main>
<footer>OndaMex <span id="app-version"></span> · läuft komplett im Browser · Deutsch ↔ Spanisch (Mexiko)</footer>

<script>
"use strict";

const DATA = [
  // Begrüßung & Höflichkeit
  { cat: "Begrüßung", de: "Hallo", es: "Hola" },
  { cat: "Begrüßung", de: "Guten Morgen", es: "Buenos días" },
  { cat: "Begrüßung", de: "Guten Tag / guten Abend", es: "Buenas tardes / buenas noches" },
  { cat: "Begrüßung", de: "Wie geht's?", es: "¿Cómo estás?" },
  { cat: "Begrüßung", de: "Sehr gut, danke", es: "Muy bien, gracias" },
  { cat: "Begrüßung", de: "Ich heiße …", es: "Me llamo …" },
  { cat: "Begrüßung", de: "Freut mich", es: "Mucho gusto" },
  { cat: "Begrüßung", de: "Bitte", es: "Por favor" },
  { cat: "Begrüßung", de: "Danke schön", es: "Muchas gracias" },
  { cat: "Begrüßung", de: "Gerne / nichts zu danken", es: "De nada" },
  { cat: "Begrüßung", de: "Entschuldigung", es: "Perdón / disculpa" },
  { cat: "Begrüßung", de: "Tschüss / bis später", es: "Adiós / hasta luego" },
  { cat: "Begrüßung", de: "Ja / Nein", es: "Sí / no" },
  { cat: "Begrüßung", de: "Sprechen Sie Englisch?", es: "¿Habla inglés?" },
  { cat: "Begrüßung", de: "Ich verstehe nicht", es: "No entiendo" },
  { cat: "Begrüßung", de: "Langsamer bitte", es: "Más despacio, por favor" },

  // Restaurant & Bar
  { cat: "Restaurant", de: "Die Karte bitte", es: "La carta, por favor" },
  { cat: "Restaurant", de: "Ich möchte gern …", es: "Quisiera …" },
  { cat: "Restaurant", de: "Was empfehlen Sie uns?", es: "¿Qué nos recomienda?" },
  { cat: "Restaurant", de: "Tisch für zwei bitte", es: "Una mesa para dos, por favor" },
  { cat: "Restaurant", de: "Ich bin Vegetarier(in)", es: "Soy vegetariano/a" },
  { cat: "Restaurant", de: "Zum Mitnehmen bitte", es: "Para llevar, por favor" },
  { cat: "Restaurant", de: "Ein Bier, bitte", es: "Una cerveza, por favor" },
  { cat: "Restaurant", de: "Eine Margarita bitte", es: "Una margarita, por favor" },
  { cat: "Restaurant", de: "Wasser ohne Eis", es: "Agua sin hielo" },
  { cat: "Restaurant", de: "Sehr lecker!", es: "¡Muy rico!" },
  { cat: "Restaurant", de: "Die Rechnung bitte", es: "La cuenta, por favor" },
  { cat: "Restaurant", de: "Trinkgeld", es: "La propina" },
  { cat: "Restaurant", de: "Hmm, Tacos / Guacamole / Ceviche", es: "Tacos / guacamole / ceviche" },
  { cat: "Restaurant", de: "Fleisch / Fisch / Garnelen", es: "Carne / pescado / camarones" },
  { cat: "Restaurant", de: "Hühnchen", es: "El pollo" },
  { cat: "Restaurant", de: "Noch etwas zu trinken?", es: "¿Algo más de tomar?" },

  // Strand & Meer
  { cat: "Strand", de: "der Strand", es: "la playa" },
  { cat: "Strand", de: "das Meer / der Ozean", es: "el mar / el océano" },
  { cat: "Strand", de: "der Sonnenschirm", es: "la sombrilla" },
  { cat: "Strand", de: "das Handtuch", es: "la toalla" },
  { cat: "Strand", de: "der Sonnenschutz", es: "el bloqueador solar" },
  { cat: "Strand", de: "schwimmen", es: "nadar" },
  { cat: "Strand", de: "die Wellen", es: "las olas" },
  { cat: "Strand", de: "der Sand", es: "la arena" },
  { cat: "Strand", de: "die Muschel", es: "la concha" },
  { cat: "Strand", de: "die Krabbe", es: "el cangrejo" },
  { cat: "Strand", de: "die Sonne / die Sonnenbrille", es: "el sol / las gafas de sol" },
  { cat: "Strand", de: "Wann schließt der Strand?", es: "¿A qué hora cierra la playa?" },
  { cat: "Strand", de: "Wo ist die Toilette?", es: "¿Dónde está el baño?" },
  { cat: "Strand", de: "die Dusche", es: "la ducha" },

  // Ausflug & Transport
  { cat: "Ausflug", de: "Wo ist …?", es: "¿Dónde está …?" },
  { cat: "Ausflug", de: "Wie komme ich nach …?", es: "¿Cómo llego a …?" },
  { cat: "Ausflug", de: "links / rechts / geradeaus", es: "a la izquierda / a la derecha / todo recto" },
  { cat: "Ausflug", de: "Ein Taxi bitte", es: "Un taxi, por favor" },
  { cat: "Ausflug", de: "Wie lange dauert die Fahrt?", es: "¿Cuánto dura el viaje?" },
  { cat: "Ausflug", de: "Fahren Sie zum Hotel …", es: "Lléveme al hotel …" },
  { cat: "Ausflug", de: "Können Sie mir helfen?", es: "¿Me puede ayudar?" },
  { cat: "Ausflug", de: "die Insel / die Ruinen / der Cenote", es: "la isla / las ruinas / el cenote" },
  { cat: "Ausflug", de: "der Colectivo (Sammeltaxi)", es: "el colectivo" },
  { cat: "Ausflug", de: "die Bootstour", es: "el paseo en lancha" },
  { cat: "Ausflug", de: "Schnorcheln", es: "el esnórquel / hacer snorkel" },
  { cat: "Ausflug", de: "Wie schön!", es: "¡Qué bonito!" },

  // Einkaufen & Money
  { cat: "Einkaufen", de: "Wie viel kostet das?", es: "¿Cuánto cuesta?" },
  { cat: "Einkaufen", de: "Das ist zu teuer", es: "Es demasiado caro" },
  { cat: "Einkaufen", de: "Kann ich mit Karte zahlen?", es: "¿Aceptan tarjeta?" },
  { cat: "Einkaufen", de: "In bar (Pesos) bitte", es: "En efectivo (en pesos), por favor" },
  { cat: "Einkaufen", de: "Haben Sie …?", es: "¿Tiene …?" },
  { cat: "Einkaufen", de: "Nur mal sehen, danke", es: "Solo mirando, gracias" },
  { cat: "Einkaufen", de: "Ich nehme das", es: "Me lo llevo" },
  { cat: "Einkaufen", de: "die Tüte", es: "la bolsa" },
  { cat: "Einkaufen", de: "der Kassenzettel", es: "el ticket" },
  { cat: "Einkaufen", de: "die Apotheke", es: "la farmacia" },
  { cat: "Einkaufen", de: "der Markt (Souvenirs)", es: "el mercado (recuerdos)" },
  { cat: "Einkaufen", de: "Sonst noch etwas?", es: "¿Algo más?" },

  // Notfall & Gesundheit
  { cat: "Notfall", de: "Hilfe!", es: "¡Ayuda! / ¡Socorro!" },
  { cat: "Notfall", de: "Ich brauche einen Arzt", es: "Necesito un médico" },
  { cat: "Notfall", de: "Das tut weh", es: "Me duele" },
  { cat: "Notfall", de: "Ich bin allergisch gegen …", es: "Soy alérgico/a a …" },
  { cat: "Notfall", de: "Ich habe meinen Pass verloren", es: "He perdido mi pasaporte" },
  { cat: "Notfall", de: "Rufen Sie bitte die Polizei", es: "Llamen a la policía, por favor" },
  { cat: "Notfall", de: "Rufen Sie bitte einen Krankenwagen", es: "Llamen a una ambulancia, por favor" },
  { cat: "Notfall", de: "der Sonnenbrand", es: "la quemadura del sol" },
  { cat: "Notfall", de: "Fieber / Übelkeit", es: "La fiebre / las náuseas" },
  { cat: "Notfall", de: "Ich bin Tourist und brauche Hilfe", es: "Soy turista y necesito ayuda" },

  // Zahlen & Zeit
  { cat: "Zahlen", de: "eins, zwei, drei", es: "uno, dos, tres" },
  { cat: "Zahlen", de: "vier, fünf, sechs", es: "cuatro, cinco, seis" },
  { cat: "Zahlen", de: "sieben, acht, neun, zehn", es: "siete, ocho, nueve, diez" },
  { cat: "Zahlen", de: "zwanzig / fünfzig / hundert", es: "veinte / cincuenta / cien" },
  { cat: "Zahlen", de: "Wie viel Uhr ist es?", es: "¿Qué hora es?" },
  { cat: "Zahlen", de: "heute / morgen / gestern", es: "hoy / mañana / ayer" },
  { cat: "Zahlen", de: "jetzt / später", es: "ahora / luego" },
  { cat: "Zahlen", de: "der Morgen / der Nachmittag / der Abend(-Nacht)", es: "la mañana / la tarde / la noche" },
  { cat: "Zahlen", de: "Noch einen (Getränk/Appetit), bitte", es: "Otro más, por favor" },
  { cat: "Zahlen", de: "der Anfang / das Ende", es: "el principio / el final" }
];

const CATS = ["Alles", ...new Set(DATA.map(d => d.cat))];

const state = {
  mode: "learn",
  cat: "Alles",
  dir: "de2es",
  learnIdx: 0,
  revealed: false,
  quizScore: 0,
  quizTotal: 0,
  quizOpen: false,
  quizCurrent: null,
};

const $ = id => document.getElementById(id);
const pool = () => state.cat === "Alles" ? DATA : DATA.filter(d => d.cat === state.cat);

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const front = c => (state.dir === "de2es" ? c.de : c.es);
const back  = c => (state.dir === "de2es" ? c.es : c.de);

// ---------- Kategorien ----------
function renderChips() {
  const el = $("chips");
  el.innerHTML = "";
  CATS.forEach(cat => {
    const b = document.createElement("button");
    b.textContent = cat === "Alles" ? "Alles (" + DATA.length + ")" : cat;
    b.className = cat === state.cat ? "active" : "";
    b.onclick = () => {
      state.cat = cat;
      state.learnIdx = 0;
      state.revealed = false;
      renderChips();
      if (state.mode === "learn") renderLearn();
      else newQuestion();
    };
    el.appendChild(b);
  });
}

// ---------- Lernmodus ----------
function renderLearn() {
  const list = pool();
  state.learnIdx = ((state.learnIdx % list.length) + list.length) % list.length;
  const c = list[state.learnIdx];
  $("front").textContent = front(c);
  $("front-hint").textContent = state.dir === "de2es" ? "Karte antippen für die Übersetzung" : "Toca la tarjeta para la traducción";
  $("back").textContent = back(c);
  $("flashcard").classList.toggle("hidden-answer", !state.revealed);
  $("learn-progress").textContent =
    (state.learnIdx + 1) + " / " + list.length +
    (state.cat === "Alles" ? " · alle Kategorien" : " · " + state.cat);
}

$("flashcard").onclick = () => {
  state.revealed = true;
  $("flashcard").classList.remove("hidden-answer");
};
$("prev").onclick = () => {
  state.learnIdx--;
  state.revealed = false;
  renderLearn();
};
$("next").onclick = () => {
  state.learnIdx++;
  state.revealed = false;
  renderLearn();
};

// ---------- Quiz ----------
function newQuestion() {
  const list = pool();
  state.quizOpen = true;
  state.quizTotal++;
  const card = list[Math.floor(Math.random() * list.length)];
  const others = shuffle(list.filter(x => x !== card)).slice(0, 3);
  const options = shuffle([card, ...others]);
  state.quizCurrent = { card, correct: options.indexOf(card) };
  $("quiz-q").textContent = front(card);
  $("quiz-score").textContent = "Richtig: " + state.quizScore + " von " + (state.quizTotal - 1);
  const box = $("quiz-choices");
  box.innerHTML = "";
  options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.textContent = back(opt);
    b.onclick = () => answer(i, box);
    box.appendChild(b);
  });
  $("quiz-next").classList.remove("visible");
}

function answer(i, box) {
  if (!state.quizOpen) return;
  state.quizOpen = false;
  const correct = state.quizCurrent.correct;
  [...box.children].forEach((b, idx) => {
    b.disabled = true;
    if (idx === correct) b.classList.add("correct");
  });
  if (i === correct) state.quizScore++;
  else box.children[i].classList.add("wrong");
  $("quiz-score").textContent = "Richtig: " + state.quizScore + " von " + state.quizTotal;
  $("quiz-next").classList.add("visible");
}

$("quiz-next").onclick = () => { newQuestion(); };

// ---------- Modus & Richtung ----------
function setMode(mode) {
  state.mode = mode;
  $("tab-learn").classList.toggle("active", mode === "learn");
  $("tab-quiz").classList.toggle("active", mode === "quiz");
  $("learn-view").hidden = mode !== "learn";
  $("quiz-view").hidden = mode !== "quiz";
  if (mode === "quiz") newQuestion();
  else renderLearn();
}
$("tab-learn").onclick = () => setMode("learn");
$("tab-quiz").onclick = () => setMode("quiz");

$("direction").onclick = () => {
  state.dir = state.dir === "de2es" ? "es2de" : "de2es";
  $("direction").textContent = state.dir === "de2es" ? "DE → ES" : "ES → DE";
  state.revealed = false;
  if (state.mode === "learn") renderLearn();
  else newQuestion();
};

// ---------- Init ----------
renderChips();
setMode("learn");
</script>
<script src="update.js"></script>
</body>
</html>
